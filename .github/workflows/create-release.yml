name: create-release

on:
  workflow_run:
    workflows:
      - build
    types:
      - completed

jobs:
  build-and-release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-jars
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Get project version
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for branch name collision
        id: check_collision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.get_version.outputs.VERSION }}
        run: |
          if git ls-remote --heads origin "$TAG_NAME" | grep -q "$TAG_NAME"; then
            echo "::error::Branch name collision detected! A branch named '$TAG_NAME' already exists."
            echo "Please delete the branch '$TAG_NAME' manually or update the version in pom.xml."
            exit 1
          else
            echo "No conflicting branch found. Proceeding..."
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.get_version.outputs.VERSION }}
        run: |
          mv demo/target/demo-$TAG_NAME.jar demo/target/custom-crafter-api-demo-$TAG_NAME.jar
          
          cat <<EOF > release-note
          **This release is accompanied by two attached files.**  
          - custom-crafter-api-$TAG_NAME.jar: **API**
          - custom-crafter-api-**demo**-$TAG_NAME.jar: **Demo plugin**
            
          EOF
          sed -n '2,${/^# /{:a;n;/^# /q;p;ba}}' CHANGELOG.md >> release-note
          
          gh release create "$TAG_NAME" \
            api/target/custom-crafter-api-$TAG_NAME.jar \
            demo/target/custom-crafter-api-demo-$TAG_NAME.jar \
            --target master \
            --title "v$TAG_NAME release" \
            --notes-file release-note \
